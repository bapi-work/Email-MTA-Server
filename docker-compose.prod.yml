# Production overrides — use with:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Set SECRET_KEY to a secure random value (python -c "import secrets; print(secrets.token_hex(32))")
#   2. Set SMTP_HOSTNAME in .env to your public mail hostname (e.g. mail.yourdomain.com)
#      — this is the FQDN used in SMTP banners, SPF/DKIM/DMARC records, and DNS
#   3. Place SSL certificate at config/ssl/cert.pem and config/ssl/key.pem
#      (or use Let's Encrypt / certbot alongside nginx — see docs/DEPLOYMENT.md)
#   4. Update CORS_ORIGINS in .env to your actual domain (e.g. https://mta.yourdomain.com)

services:

  # ─── Backend: production-grade uvicorn (no --reload, multi-worker) ───
  backend:
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --log-level warning
      --access-log
      --no-use-colors
    environment:
      DEBUG: "false"
      LOG_LEVEL: "WARNING"
    ports: !reset []    # don't expose backend port directly in production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  # ─── Frontend: production build only, no dev server ────────────────
  frontend:
    build:
      args:
        # Relative path — nginx proxies /api/* to the backend in production.
        # The base compose file bakes in http://localhost:8000 for the dev
        # convenience of hitting port 3000 directly without nginx; that value
        # would be wrong here since real visitors' browsers can't resolve
        # "localhost". Override to your public API origin instead if the API
        # is ever served from a different host than the frontend.
        REACT_APP_API_URL: ""
    environment:
      REACT_APP_ENV: production
    ports: !reset []    # served exclusively through nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ─── PostgreSQL: no external port exposure ───────────────────────────
  postgres:
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Redis: no external port exposure ───────────────────────────────
  redis:
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── SMTP server constraints ─────────────────────────────────────────
  smtp-server:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ─── Nginx: HTTPS termination ───────────────────────────────────────
  nginx:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
