services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudmta_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-cloudmta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CloudMTA2026!}
      POSTGRES_DB: ${DB_NAME:-cloudmta_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5433:5432"    # expose locally for dev; remove in docker-compose.prod.yml
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cloudmta} -d ${DB_NAME:-cloudmta_db} && psql -U ${DB_USER:-cloudmta} -d ${DB_NAME:-cloudmta_db} -c 'SELECT 1 FROM users LIMIT 1' -q --no-align --tuples-only 2>/dev/null | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - cloudmta_network

  redis:
    image: redis:7-alpine
    container_name: cloudmta_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-Redis2026!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"    # expose locally for dev; remove in docker-compose.prod.yml
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Redis2026!}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloudmta_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudmta_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cloudmta}:${DB_PASSWORD:-CloudMTA2026!}@postgres:5432/${DB_NAME:-cloudmta_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-Redis2026!}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./config:/config
    networks:
      - cloudmta_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  smtp-server:
    build:
      context: ./smtp-server
      dockerfile: Dockerfile
    container_name: cloudmta_smtp
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cloudmta}:${DB_PASSWORD:-CloudMTA2026!}@postgres:5432/${DB_NAME:-cloudmta_db}
      DB_HOST: ${DB_HOST:-postgres}
      DB_USER: ${DB_USER:-cloudmta}
      DB_PASSWORD: ${DB_PASSWORD:-CloudMTA2026!}
      DB_NAME: ${DB_NAME:-cloudmta_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-Redis2026!}@redis:6379/1
      API_BASE_URL: http://backend:8000
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_TLS_PORT: ${SMTP_TLS_PORT:-587}
      SMTP_SSL_PORT: ${SMTP_SSL_PORT:-465}
    ports:
      - "${SMTP_PORT:-25}:${SMTP_PORT:-25}"         # SMTP (plain)
      - "${SMTP_TLS_PORT:-587}:${SMTP_TLS_PORT:-587}" # Submission (STARTTLS)
      - "${SMTP_SSL_PORT:-465}:${SMTP_SSL_PORT:-465}" # SMTPS (implicit TLS)
      - "9000:9000"                                  # Health check endpoint
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./smtp-server:/app
      - ./config:/config
      - smtp_logs:/var/log/mailserver
    networks:
      - cloudmta_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "http://localhost:8000"
    container_name: cloudmta_frontend
    environment:
      REACT_APP_ENV: ${ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cloudmta_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: cloudmta_nginx
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl-init.sh:/docker-entrypoint.d/10-ssl-init.sh:ro
      - ./config/ssl:/etc/nginx/ssl          # writable so ssl-init can write certs
    depends_on:
      - backend
      - frontend
    networks:
      - cloudmta_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  smtp_logs:

networks:
  cloudmta_network:
    driver: bridge
